<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSN REPS — CRM</title>
<meta name="description" content="JSN REPS CRM — Contacts, deals, and activity tracking for Massachusetts real estate professionals.">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/reps/auth.js"></script>
<script src="/reps/paywall.js"></script>
<style>
:root {
  --bg:      #0b1120;
  --surface: #121c30;
  --surface2:#1a2640;
  --border:  #1e2d47;
  --accent:  #00d4c8;
  --cta:     #ff6b2b;
  --text:    #ffffff;
  --muted:   rgba(255,255,255,0.45);
  --green:   #1fd38a;
  --red:     #ff3d52;
  --font-head: 'Barlow Condensed', sans-serif;
  --font-body: 'Barlow', sans-serif;
  --font-mono: 'DM Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;min-height:100vh;}
.page-shell{padding:72px 0 60px;}

/* ── TABS ── */
.tab-bar{
  display:flex;gap:2px;padding:20px 24px 0;border-bottom:1px solid var(--border);
  position:sticky;top:48px;background:var(--bg);z-index:100;
}
.tab-btn{
  padding:10px 20px;border:none;background:none;color:var(--muted);
  font-family:var(--font-head);font-size:14px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent;
  transition:all .18s;
}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}

/* ── PANEL ── */
.tab-panel{display:none;padding:24px;}
.tab-panel.active{display:block;}

/* ── TOOLBAR ── */
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
.toolbar-title{font-family:var(--font-head);font-size:22px;font-weight:800;letter-spacing:.02em;flex:1;}
.search-input,.filter-select{
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  padding:8px 14px;border-radius:6px;font-size:13px;font-family:var(--font-body);
  outline:none;transition:border-color .18s;
}
.search-input:focus,.filter-select:focus{border-color:var(--accent);}
.filter-select option{background:var(--surface);}
.btn{
  padding:8px 18px;border-radius:6px;font-size:13px;font-weight:700;
  font-family:var(--font-head);letter-spacing:.05em;text-transform:uppercase;
  cursor:pointer;border:none;transition:all .18s;
}
.btn-primary{background:var(--cta);color:#fff;}
.btn-primary:hover{background:#e85d22;}
.btn-ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);}
.btn-ghost:hover{background:rgba(0,212,200,.08);}
.btn-sm{padding:5px 12px;font-size:11px;}
.btn-danger{background:transparent;color:var(--red);border:1px solid rgba(255,61,82,.3);}
.btn-danger:hover{background:rgba(255,61,82,.08);}

/* ── TABLE ── */
.crm-table{width:100%;border-collapse:collapse;font-size:14px;}
.crm-table th{
  text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);
  font-family:var(--font-head);font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);
}
.crm-table td{
  padding:12px 14px;border-bottom:1px solid rgba(30,45,71,.5);
  vertical-align:middle;
}
.crm-table tr:hover td{background:rgba(255,255,255,.02);}
.crm-table tr:last-child td{border-bottom:none;}

/* ── BADGES ── */
.badge{
  display:inline-block;padding:3px 9px;border-radius:4px;
  font-family:var(--font-head);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
}
.badge-buyer    {background:rgba(0,212,200,.12); color:var(--accent);}
.badge-seller   {background:rgba(255,107,43,.12);color:#ff8c55;}
.badge-investor {background:rgba(77,159,255,.12);color:#4d9fff;}
.badge-lead     {background:rgba(255,255,255,.06);color:var(--muted);}
.badge-lead-stage    {background:rgba(255,255,255,.06);color:var(--muted);}
.badge-active   {background:rgba(0,212,200,.12);color:var(--accent);}
.badge-under_contract{background:rgba(31,211,138,.12);color:var(--green);}
.badge-closed   {background:rgba(31,211,138,.18);color:var(--green);font-weight:900;}
.badge-dead     {background:rgba(255,61,82,.1);color:var(--red);}

/* ── EMPTY STATE ── */
.empty{
  text-align:center;padding:60px 20px;color:var(--muted);
  font-family:var(--font-head);font-size:15px;letter-spacing:.04em;
}
.empty span{display:block;font-size:32px;margin-bottom:12px;opacity:.3;}

/* ── INLINE FORM ── */
.form-panel{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:24px;margin-bottom:24px;display:none;
}
.form-panel.open{display:block;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px;}
.form-group{display:flex;flex-direction:column;gap:5px;}
.form-group label{font-family:var(--font-head);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);}
.form-control{
  background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:9px 12px;border-radius:6px;font-family:var(--font-body);font-size:14px;outline:none;
  transition:border-color .18s;
}
.form-control:focus{border-color:var(--accent);}
.form-control option{background:var(--surface2);}
textarea.form-control{resize:vertical;min-height:80px;}
.form-actions{display:flex;gap:10px;align-items:center;}
.form-error{color:var(--red);font-size:13px;margin-left:auto;}

/* ── DETAIL PANEL ── */
.detail-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.detail-overlay.open{display:flex;}
.detail-box{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  width:100%;max-width:640px;max-height:85vh;overflow-y:auto;padding:28px;
  position:relative;
}
.detail-close{
  position:absolute;top:16px;right:16px;background:none;border:none;
  color:var(--muted);font-size:20px;cursor:pointer;line-height:1;
}
.detail-close:hover{color:var(--text);}
.detail-title{font-family:var(--font-head);font-size:22px;font-weight:800;margin-bottom:4px;}
.detail-sub{font-size:13px;color:var(--muted);margin-bottom:20px;}
.detail-section{margin-bottom:20px;}
.detail-section h4{
  font-family:var(--font-head);font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin-bottom:10px;
  padding-bottom:6px;border-bottom:1px solid var(--border);
}
.deal-chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--surface2);border:1px solid var(--border);border-radius:5px;
  padding:5px 10px;margin:3px;font-size:13px;
}

/* ── ACTIVITY FEED ── */
.activity-item{
  display:flex;gap:14px;padding:14px 0;border-bottom:1px solid rgba(30,45,71,.5);
  align-items:flex-start;
}
.activity-item:last-child{border-bottom:none;}
.activity-dot{
  width:8px;height:8px;border-radius:50%;background:var(--accent);
  margin-top:6px;flex-shrink:0;
}
.activity-body{flex:1;}
.activity-app{
  font-family:var(--font-mono);font-size:11px;color:var(--accent);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;
}
.activity-note{font-size:14px;color:var(--text);margin-bottom:3px;}
.activity-meta{font-size:12px;color:var(--muted);}

/* ── STAGE SELECT ── */
.stage-select{
  background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:4px 8px;border-radius:4px;font-size:12px;font-family:var(--font-mono);
  cursor:pointer;outline:none;
}
.stage-select:focus{border-color:var(--accent);}

/* ── LOADING ── */
.loading{
  text-align:center;padding:40px;color:var(--muted);
  font-family:var(--font-mono);font-size:13px;letter-spacing:.04em;
}
.saving-indicator{
  font-size:12px;font-family:var(--font-mono);color:var(--accent);
  margin-left:8px;opacity:0;transition:opacity .2s;
}
.saving-indicator.show{opacity:1;}
</style>
</head>
<body>
<div class="page-shell">

  <!-- TABS -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('contacts')">Contacts</button>
    <button class="tab-btn"        onclick="switchTab('deals')">Deals</button>
    <button class="tab-btn"        onclick="switchTab('activity')">Activity Feed</button>
  </div>

  <!-- ── CONTACTS ── -->
  <div id="tab-contacts" class="tab-panel active">
    <div class="toolbar">
      <span class="toolbar-title">Contacts</span>
      <input class="search-input" id="contactSearch" placeholder="Search name, email..." oninput="filterContacts()">
      <select class="filter-select" id="contactRoleFilter" onchange="filterContacts()">
        <option value="">All Roles</option>
        <option value="buyer">Buyer</option>
        <option value="seller">Seller</option>
        <option value="investor">Investor</option>
        <option value="lead">Lead</option>
      </select>
      <button class="btn btn-primary" onclick="toggleForm('contactForm')">+ Add Contact</button>
    </div>

    <!-- Add Contact Form -->
    <div class="form-panel" id="contactForm">
      <div class="form-grid">
        <div class="form-group">
          <label>Name *</label>
          <input class="form-control" id="cf-name" placeholder="Full name">
        </div>
        <div class="form-group">
          <label>Role</label>
          <select class="form-control" id="cf-role">
            <option value="">Select role</option>
            <option value="buyer">Buyer</option>
            <option value="seller">Seller</option>
            <option value="investor">Investor</option>
            <option value="lead">Lead</option>
          </select>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input class="form-control" id="cf-phone" placeholder="(617) 555-0100">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input class="form-control" id="cf-email" type="email" placeholder="name@example.com">
        </div>
        <div class="form-group">
          <label>Source</label>
          <input class="form-control" id="cf-source" placeholder="Referral, Zillow, Open house...">
        </div>
        <div class="form-group" style="grid-column:1/-1">
          <label>Notes</label>
          <textarea class="form-control" id="cf-notes" placeholder="Add any context..."></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="saveContact()">Save Contact</button>
        <button class="btn btn-ghost" onclick="toggleForm('contactForm')">Cancel</button>
        <span class="form-error" id="contactFormError"></span>
      </div>
    </div>

    <div id="contactsTable">
      <div class="loading">Loading contacts...</div>
    </div>
  </div>

  <!-- ── DEALS ── -->
  <div id="tab-deals" class="tab-panel">
    <div class="toolbar">
      <span class="toolbar-title">Deals</span>
      <select class="filter-select" id="dealStageFilter" onchange="filterDeals()">
        <option value="">All Stages</option>
        <option value="lead">Lead</option>
        <option value="active">Active</option>
        <option value="under_contract">Under Contract</option>
        <option value="closed">Closed</option>
        <option value="dead">Dead</option>
      </select>
      <button class="btn btn-primary" onclick="toggleForm('dealForm')">+ Add Deal</button>
    </div>

    <!-- Add Deal Form -->
    <div class="form-panel" id="dealForm">
      <div class="form-grid">
        <div class="form-group">
          <label>Contact</label>
          <select class="form-control" id="df-contact"></select>
        </div>
        <div class="form-group">
          <label>Property</label>
          <select class="form-control" id="df-property">
            <option value="">No property linked</option>
          </select>
        </div>
        <div class="form-group">
          <label>Stage</label>
          <select class="form-control" id="df-stage">
            <option value="lead">Lead</option>
            <option value="active">Active</option>
            <option value="under_contract">Under Contract</option>
            <option value="closed">Closed</option>
            <option value="dead">Dead</option>
          </select>
        </div>
        <div class="form-group">
          <label>Value ($)</label>
          <input class="form-control" id="df-value" type="number" placeholder="0">
        </div>
        <div class="form-group">
          <label>Close Date</label>
          <input class="form-control" id="df-close" type="date">
        </div>
        <div class="form-group" style="grid-column:1/-1">
          <label>Notes</label>
          <textarea class="form-control" id="df-notes" placeholder="Deal context, next steps..."></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="saveDeal()">Save Deal</button>
        <button class="btn btn-ghost"   onclick="toggleForm('dealForm')">Cancel</button>
        <span class="form-error" id="dealFormError"></span>
      </div>
    </div>

    <div id="dealsTable">
      <div class="loading">Loading deals...</div>
    </div>
  </div>

  <!-- ── ACTIVITY FEED ── -->
  <div id="tab-activity" class="tab-panel">
    <div class="toolbar">
      <span class="toolbar-title">Activity Feed</span>
    </div>
    <div id="activityFeed">
      <div class="loading">Loading activity...</div>
    </div>
  </div>

</div><!-- /page-shell -->

<!-- CONTACT DETAIL OVERLAY -->
<div class="detail-overlay" id="contactDetail" onclick="closeDetail('contactDetail')">
  <div class="detail-box" onclick="event.stopPropagation()">
    <button class="detail-close" onclick="closeDetail('contactDetail')">&times;</button>
    <div class="detail-title" id="detailName"></div>
    <div class="detail-sub"   id="detailSub"></div>
    <div class="detail-section">
      <h4>Deals</h4>
      <div id="detailDeals"></div>
    </div>
    <div class="detail-section">
      <h4>Recent Activity</h4>
      <div id="detailActivity"></div>
    </div>
  </div>
</div>

<script src="/jsn-nav.js"></script>
<script>
// ─────────────────────────────────────────────────────────
// Config
// ─────────────────────────────────────────────────────────
const WORKER_URL = 'https://jsn-reps-proxy.wewearsmiles.workers.dev';

let currentUserId  = null;
let currentJWT     = null;
let allContacts    = [];
let allDeals       = [];
let allActivities  = [];

// ─────────────────────────────────────────────────────────
// CRM API
// ─────────────────────────────────────────────────────────
async function crmRequest(action, table, opts = {}) {
  const res = await fetch(`${WORKER_URL}/crm`, {
    method: 'POST',
    headers: {
      'Content-Type':  'application/json',
      'Authorization': `Bearer ${currentJWT}`,
    },
    body: JSON.stringify({ action, table, ...opts }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `HTTP ${res.status}`);
  }
  return res.json();
}

// ─────────────────────────────────────────────────────────
// Tabs
// ─────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    const tabs = ['contacts','deals','activity'];
    b.classList.toggle('active', tabs[i] === name);
  });
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');

  if (name === 'activity' && allActivities.length === 0) loadActivities();
}

function toggleForm(id) {
  const el = document.getElementById(id);
  el.classList.toggle('open');
  if (el.classList.contains('open') && id === 'dealForm') populateDealFormSelects();
}

function closeDetail(id) {
  document.getElementById(id).classList.remove('open');
}

// ─────────────────────────────────────────────────────────
// CONTACTS
// ─────────────────────────────────────────────────────────
async function loadContacts() {
  try {
    const { data } = await crmRequest('select', 'crm_contacts');
    allContacts = data || [];
    renderContacts(allContacts);
  } catch(e) {
    document.getElementById('contactsTable').innerHTML =
      `<div class="empty"><span>!</span>Could not load contacts: ${e.message}</div>`;
  }
}

function filterContacts() {
  const q    = document.getElementById('contactSearch').value.toLowerCase();
  const role = document.getElementById('contactRoleFilter').value;
  const filtered = allContacts.filter(c => {
    const matchQ    = !q    || (c.name||'').toLowerCase().includes(q) || (c.email||'').toLowerCase().includes(q);
    const matchRole = !role || c.role === role;
    return matchQ && matchRole;
  });
  renderContacts(filtered);
}

function renderContacts(contacts) {
  const el = document.getElementById('contactsTable');
  if (!contacts.length) {
    el.innerHTML = '<div class="empty"><span>&#128100;</span>No contacts yet. Add one above.</div>';
    return;
  }
  el.innerHTML = `
    <table class="crm-table">
      <thead><tr>
        <th>Name</th><th>Role</th><th>Phone</th><th>Email</th><th>Deals</th><th></th>
      </tr></thead>
      <tbody>
        ${contacts.map(c => `
          <tr>
            <td><strong>${esc(c.name)}</strong></td>
            <td>${c.role ? `<span class="badge badge-${c.role}">${c.role}</span>` : '<span style="color:var(--muted)">--</span>'}</td>
            <td style="font-family:var(--font-mono);font-size:13px">${esc(c.phone||'--')}</td>
            <td style="font-size:13px;color:var(--muted)">${esc(c.email||'--')}</td>
            <td style="font-family:var(--font-mono);font-size:13px">${(c.crm_deals||[]).length}</td>
            <td><button class="btn btn-ghost btn-sm" onclick="openContactDetail('${c.id}')">View</button></td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

async function saveContact() {
  const errEl = document.getElementById('contactFormError');
  errEl.textContent = '';
  const name = document.getElementById('cf-name').value.trim();
  if (!name) { errEl.textContent = 'Name is required.'; return; }

  const data = {
    user_id: currentUserId,
    name,
    role:   document.getElementById('cf-role').value  || null,
    phone:  document.getElementById('cf-phone').value.trim() || null,
    email:  document.getElementById('cf-email').value.trim() || null,
    source: document.getElementById('cf-source').value.trim() || null,
    notes:  document.getElementById('cf-notes').value.trim()  || null,
  };

  try {
    await crmRequest('insert', 'crm_contacts', { data });
    toggleForm('contactForm');
    ['cf-name','cf-role','cf-phone','cf-email','cf-source','cf-notes'].forEach(id => {
      const el = document.getElementById(id);
      el.tagName === 'SELECT' ? (el.selectedIndex = 0) : (el.value = '');
    });
    await loadContacts();
  } catch(e) {
    errEl.textContent = e.message;
  }
}

function openContactDetail(contactId) {
  const c = allContacts.find(x => x.id === contactId);
  if (!c) return;
  document.getElementById('detailName').textContent = c.name;
  document.getElementById('detailSub').textContent  =
    [c.role, c.phone, c.email].filter(Boolean).join(' · ') || 'No contact details';

  const deals = c.crm_deals || [];
  document.getElementById('detailDeals').innerHTML = deals.length
    ? deals.map(d => `
        <span class="deal-chip">
          <span class="badge badge-${d.stage}">${d.stage}</span>
          ${d.value ? '$' + Number(d.value).toLocaleString() : 'no value'}
        </span>`).join('')
    : '<div style="color:var(--muted);font-size:13px">No linked deals yet.</div>';

  const activities = allActivities.filter(a => deals.some(d => d.id === a.deal_id));
  document.getElementById('detailActivity').innerHTML = activities.length
    ? activities.slice(0,5).map(a => `
        <div class="activity-item">
          <div class="activity-dot"></div>
          <div class="activity-body">
            <div class="activity-app">${esc(a.created_by_app||'system')}</div>
            <div class="activity-note">${esc(a.note||'')}</div>
            <div class="activity-meta">${fmtDate(a.created_at)}</div>
          </div>
        </div>`).join('')
    : '<div style="color:var(--muted);font-size:13px">No activity recorded.</div>';

  document.getElementById('contactDetail').classList.add('open');
}

// ─────────────────────────────────────────────────────────
// DEALS
// ─────────────────────────────────────────────────────────
async function loadDeals() {
  try {
    const { data } = await crmRequest('select', 'crm_deals');
    allDeals = data || [];
    renderDeals(allDeals);
  } catch(e) {
    document.getElementById('dealsTable').innerHTML =
      `<div class="empty"><span>!</span>Could not load deals: ${e.message}</div>`;
  }
}

function filterDeals() {
  const stage = document.getElementById('dealStageFilter').value;
  renderDeals(stage ? allDeals.filter(d => d.stage === stage) : allDeals);
}

function renderDeals(deals) {
  const el = document.getElementById('dealsTable');
  if (!deals.length) {
    el.innerHTML = '<div class="empty"><span>&#128203;</span>No deals yet. Add one above.</div>';
    return;
  }
  el.innerHTML = `
    <table class="crm-table">
      <thead><tr>
        <th>Contact</th><th>Property</th><th>Stage</th>
        <th>Value</th><th>Close Date</th><th></th>
      </tr></thead>
      <tbody>
        ${deals.map(d => `
          <tr>
            <td><strong>${esc((d.crm_contacts?.name)||'--')}</strong></td>
            <td style="font-size:13px;color:var(--muted)">${esc((d.crm_properties?.address)||'--')}</td>
            <td>
              <select class="stage-select" onchange="updateDealStage('${d.id}', this.value, this)">
                ${['lead','active','under_contract','closed','dead'].map(s =>
                  `<option value="${s}"${d.stage===s?' selected':''}>${s.replace('_',' ')}</option>`
                ).join('')}
              </select>
              <span class="saving-indicator" id="save-${d.id}">saved</span>
            </td>
            <td style="font-family:var(--font-mono);font-size:13px">${d.value ? '$'+Number(d.value).toLocaleString() : '--'}</td>
            <td style="font-family:var(--font-mono);font-size:13px">${d.close_date||'--'}</td>
            <td><button class="btn btn-danger btn-sm" onclick="deleteDeal('${d.id}')">Remove</button></td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

async function updateDealStage(dealId, newStage, selectEl) {
  const ind = document.getElementById('save-' + dealId);
  try {
    await crmRequest('update', 'crm_deals', { id: dealId, data: { stage: newStage } });
    const deal = allDeals.find(d => d.id === dealId);
    if (deal) deal.stage = newStage;
    if (ind) { ind.textContent = 'saved'; ind.classList.add('show'); setTimeout(() => ind.classList.remove('show'), 1500); }
  } catch(e) {
    if (ind) { ind.textContent = 'error'; ind.classList.add('show'); setTimeout(() => ind.classList.remove('show'), 2000); }
  }
}

async function deleteDeal(dealId) {
  if (!confirm('Remove this deal? This cannot be undone.')) return;
  try {
    await crmRequest('delete', 'crm_deals', { id: dealId });
    allDeals = allDeals.filter(d => d.id !== dealId);
    filterDeals();
  } catch(e) { alert('Could not remove deal: ' + e.message); }
}

async function populateDealFormSelects() {
  const cs = document.getElementById('df-contact');
  const ps = document.getElementById('df-property');

  cs.innerHTML = '<option value="">No contact linked</option>';
  allContacts.forEach(c => {
    const o = document.createElement('option');
    o.value = c.id; o.textContent = c.name;
    cs.appendChild(o);
  });

  try {
    const { data } = await crmRequest('select', 'crm_properties');
    ps.innerHTML = '<option value="">No property linked</option>';
    (data||[]).forEach(p => {
      const o = document.createElement('option');
      o.value = p.id; o.textContent = p.address;
      ps.appendChild(o);
    });
  } catch(e) {}
}

async function saveDeal() {
  const errEl = document.getElementById('dealFormError');
  errEl.textContent = '';
  const data = {
    user_id:     currentUserId,
    contact_id:  document.getElementById('df-contact').value  || null,
    property_id: document.getElementById('df-property').value || null,
    stage:       document.getElementById('df-stage').value    || 'lead',
    value:       parseFloat(document.getElementById('df-value').value) || null,
    close_date:  document.getElementById('df-close').value    || null,
    notes:       document.getElementById('df-notes').value.trim() || null,
  };

  try {
    await crmRequest('insert', 'crm_deals', { data });
    toggleForm('dealForm');
    await loadDeals();
  } catch(e) {
    errEl.textContent = e.message;
  }
}

// ─────────────────────────────────────────────────────────
// ACTIVITY FEED
// ─────────────────────────────────────────────────────────
async function loadActivities() {
  try {
    const { data } = await crmRequest('select', 'crm_activities');
    allActivities = data || [];
    renderActivities(allActivities);
  } catch(e) {
    document.getElementById('activityFeed').innerHTML =
      `<div class="empty"><span>!</span>Could not load activity: ${e.message}</div>`;
  }
}

function renderActivities(activities) {
  const el = document.getElementById('activityFeed');
  if (!activities.length) {
    el.innerHTML = '<div class="empty"><span>&#128336;</span>No activity recorded yet.</div>';
    return;
  }
  el.innerHTML = activities.map(a => `
    <div class="activity-item">
      <div class="activity-dot"></div>
      <div class="activity-body">
        <div class="activity-app">${esc(a.created_by_app||'system')}</div>
        <div class="activity-note">${esc(a.note||'')}</div>
        <div class="activity-meta">
          ${fmtDate(a.created_at)}
          ${a.crm_deals ? ' &middot; Deal: ' + esc(a.crm_deals.notes||a.deal_id||'') : ''}
        </div>
      </div>
    </div>`).join('');
}

// ─────────────────────────────────────────────────────────
// Utilities
// ─────────────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

// ─────────────────────────────────────────────────────────
// Boot
// ─────────────────────────────────────────────────────────
(async function boot() {
  await JSNAuth.init();

  const session = JSNAuth.getSession();
  if (!session) {
    window.location.href = '/login.html';
    return;
  }

  currentUserId = session.user.id;
  currentJWT    = JSNAuth.getJWT();

  const status = await JSNPaywall.check('crm');
  if (!status.allowed) return;

  // Load contacts and deals (activities load on tab switch)
  await Promise.all([loadContacts(), loadDeals()]);
})();
</script>
</body>
</html>
